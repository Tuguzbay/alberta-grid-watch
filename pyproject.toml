[project]
name = "gridwatch"
version = "0.1.0"
description = "Alberta Grid & Data Centre Watch: pool price forecasting, grid-document RAG, bill/scenario tools"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "holidays>=0.60",
    "fastembed>=0.5",
    "pypdf>=5",
    "tzdata>=2026.5",
    "anthropic>=1.15",  # 2026e: Alberta on UTC-6 all year; workflows set PYTHONTZPATH="" to use it
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits real external APIs (needs AESO_API_KEY); run with -m live"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
